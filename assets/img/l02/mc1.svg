<title>Hai người đi bộ sánh vai nhau</title>
<desc>Một người phụ nữ mặc áo xanh ngọc và một người đàn ông mặc áo vest xanh đậm, nhìn nghiêng, đang bước đi cạnh nhau cùng hướng sang phải, mỗi người một chân bước tới và hai tay vung nhẹ. Chỉ người phụ nữ đeo ba lô màu tím: dây đeo vắt qua ngực và nắp ba lô nhô lên trên vai. Hai bên đường có cây xanh.</desc>
