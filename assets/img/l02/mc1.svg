<title>Hai người đi bộ sánh vai nhau</title>
<desc>Một người phụ nữ mặc áo xanh ngọc và một người đàn ông mặc áo vest xanh đậm cùng bước về phía người xem, vai sát vai, mỗi người đang bước một chân, hai tay vung nhẹ. Chỉ người phụ nữ đeo ba lô màu tím: hai dây đeo vắt qua ngực, phần nắp ba lô nhô lên trên vai và hai bên thân. Hai bên đường có cây xanh.</desc>
