<title>Ba người quanh bàn xem bản vẽ</title>
<desc>Ba người đứng quanh một cái bàn gỗ có tờ bản vẽ trải trên mặt: một người phụ nữ đứng ở đầu bàn bên trái, một người đàn ông đứng phía sau bàn ở giữa và một người phụ nữ đứng ở đầu bàn bên phải. Hai người phụ nữ buông tay xuôi hai bên người. Chỉ người đàn ông duỗi một cánh tay ra và chỉ ngón tay vào tờ giấy. Trên bàn có một cốc nhỏ màu hồng.</desc>
