<title>Ba người xếp hàng ở quầy cà phê</title>
<desc>Ba người đứng thành một hàng, cùng quay mặt về phía quầy ở bên phải. Người đàn ông ở cuối hàng đang nhìn điện thoại trong tay. Người phụ nữ đứng giữa cầm một chiếc túi xách màu cam. Người đàn ông đứng đầu hàng đưa tấm thẻ về phía quầy. Trên quầy có một cốc.</desc>
