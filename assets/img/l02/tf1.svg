<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Ba người xếp hàng ở quầy cà phê</title>
<desc>Ba người đứng nghiêng người, nối đuôi nhau thành một hàng và cùng hướng về quầy ở bên phải. Người đàn ông áo xanh lá đứng cuối hàng cúi đầu nhìn chiếc điện thoại màu đen trong tay. Người phụ nữ tóc dài mặc váy tím đứng giữa, tay cầm một chiếc túi xách màu cam. Người đàn ông áo tím đứng đầu hàng đưa tấm thẻ màu vàng về phía quầy. Trên quầy có một cốc.</desc>
