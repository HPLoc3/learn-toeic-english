<title>Hai người phụ nữ ở tiệm hoa</title>
<desc>Hai người phụ nữ đứng cạnh nhau sau quầy trong một tiệm hoa. Người bên trái mặc áo len nâu, đeo kính tròn, tóc búi, tay cầm một bó hoa. Người bên phải tóc đen ngang vai, mặc áo xanh ngọc, đưa tay chỉ vào bó hoa. Cả hai cùng nhìn bó hoa. Trên tường có những lọ hoa.</desc>
