<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Hồ nước có núi ở xa, thuyền, ghế dài và cây</title>
<desc>Một khung cảnh bên hồ, không có người. Ở phía xa, một dãy núi màu tím với ba đỉnh nằm sát nhau trên đường chân trời. Giữa mặt hồ xanh có một chiếc thuyền buồm màu cam nổi một mình. Ở phía gần, trên bãi cỏ, có một cái ghế dài bằng gỗ ở bên trái và một cái cây xanh ở bên phải.</desc>
