<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Con đường chạy qua cánh đồng, hàng rào và nhà kho</title>
<desc>Một cánh đồng xanh không có người và không có xe. Một con đường nhựa duy nhất chạy thẳng từ phía gần ra xa, xuyên qua cánh đồng, với vạch trắng ở giữa. Một hàng rào gỗ chạy dọc theo bên phải con đường, chỉ có ở một bên. Ở phía xa bên trái có một nhà kho nhỏ màu đỏ.</desc>
