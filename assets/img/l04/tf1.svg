<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Công viên có lối đi, hàng cây, ghế dài và cột đèn</title>
<desc>Một công viên không có người. Một lối đi màu be chạy thẳng từ phía gần ra xa. Mỗi bên lối đi có hai cái cây xanh, tổng cộng bốn cây, một cây to ở gần và một cây nhỏ hơn ở xa. Ở phía gần bên phải, ngay cạnh lối đi, có một cái ghế dài bằng gỗ. Ở phía gần bên trái có một cột đèn đường màu xám, không sáng. Ở phía xa, sau cuối lối đi, có một ngọn đồi xanh.</desc>
