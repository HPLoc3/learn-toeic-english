<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Cây cầu bắc ngang con sông, mỗi bờ có một cái cây</title>
<desc>Một khung cảnh không có người. Một con sông xanh chảy ở giữa hình, hai bên là bờ cỏ. Một cây cầu duy nhất, mặt cầu bằng gỗ có lan can, bắc ngang qua sông từ bờ trái sang bờ phải, đỡ bởi hai trụ trong nước. Trên bờ trái có một cái cây xanh và trên bờ phải có một cái cây xanh, mỗi bờ một cây. Trên sông không có thuyền.</desc>
<rect width="800" height="600" fill="#f5f3ff"/>
