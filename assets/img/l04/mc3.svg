<g transform="translate(150 505)"><rect x="-6" y="-2" width="12" height="18" fill="#8a5a3b"/><path d="M-34 0L0 -60L34 0Z" fill="#3f9d57"/><path d="M-28 -34L0 -90L28 -34Z" fill="#3f9d57"/></g>
