<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Ngọn núi phủ tuyết in bóng xuống hồ, ba cây thông bên trái</title>
<desc>Một khung cảnh không có người và không có thuyền. Ở phía xa, một ngọn núi lớn màu tím, phần đỉnh phủ tuyết trắng. Phía trước núi là mặt hồ xanh, trên mặt hồ in bóng ngọn núi (bóng ngược, màu nhạt hơn). Ở phía gần bên trái, trên bờ cỏ, có ba cây thông xanh, không có tuyết trên cây.</desc>
