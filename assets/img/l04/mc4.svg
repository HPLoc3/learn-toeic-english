<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Con phố lúc chiều tối có bốn tòa nhà và ba đèn đường sáng</title>
<desc>Một con phố lúc chiều tối, không có người và không có xe. Ở phía sau, bốn tòa nhà đứng sát nhau thành một dãy dọc theo con đường, cao thấp khác nhau, cửa sổ tối. Trên vỉa hè phía trước các tòa nhà có ba cột đèn đường, cách đều nhau, và cả ba đèn đều đang sáng vàng. Phía trước vỉa hè là mặt đường trống có vạch trắng ở giữa.</desc>
