<path d="M130 380H250L232 410H148Z" fill="#ff9f43"/><path d="M190 380V316" fill="none"/><path d="M196 320L238 372H196Z" fill="#ffffff"/>
<rect x="360" y="360" width="130" height="30" rx="10" fill="#4a90d9"/><rect x="396" y="336" width="54" height="26" rx="6" fill="#ffffff"/>
<path d="M620 410H800V600H600Z" fill="#d9d2ff"/>
<rect x="400" y="440" width="10" height="46" fill="#8a5a3b"/><rect x="470" y="440" width="10" height="46" fill="#8a5a3b"/><rect x="540" y="440" width="10" height="46" fill="#8a5a3b"/>
