<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Bến cảng có ba tòa nhà, hai chiếc thuyền và một cầu tàu</title>
<desc>Một bến cảng không có người. Ở phía xa, bên kia mặt nước, ba tòa nhà đứng thành một hàng trên bờ: tòa bên trái màu hồng nhạt, tòa ở giữa màu vàng nhạt, tòa bên phải màu tím nhạt. Trên mặt nước có hai chiếc thuyền: một thuyền buồm màu cam ở bên trái và một thuyền máy màu xanh dương ở giữa. Ở phía gần bên phải, một cầu tàu bằng gỗ vươn từ bờ ra mặt nước.</desc>
<rect width="800" height="600" fill="#f5f3ff"/>
<rect x="0" y="0" width="800" height="300" fill="#ece8ff"/>
<rect x="0" y="300" width="800" height="300" fill="#8fc5f0"/>
<g stroke="#1b1740" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<rect x="60" y="150" width="140" height="150" fill="#e7b9a0"/><rect x="230" y="180" width="140" height="120" fill="#f3d28b"/><rect x="400" y="130" width="150" height="170" fill="#c9b8f5"/>
