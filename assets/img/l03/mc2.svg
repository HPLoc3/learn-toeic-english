<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Bàn làm việc có đèn treo phía trên</title>
<desc>Một bàn làm việc không có người. Một cái đèn màu vàng treo bằng dây từ trần nhà xuống, ở phía trên chính giữa bàn. Trên mặt bàn có một màn hình ở giữa, một xấp giấy xếp chồng ở bên trái màn hình và một chậu cây nhỏ ở bên phải màn hình.</desc>
