<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Phòng khách có ghế sofa, đèn và bàn trà</title>
<desc>Một phòng khách không có người. Một ghế sofa màu tím đặt sát tường, trên ghế có hai cái gối tựa, một màu vàng và một màu cam. Trên tường, phía trên ghế sofa, treo một bức tranh phong cảnh. Bên phải ghế sofa có một cái đèn sàn đứng riêng. Phía trước ghế sofa, trên tấm thảm hồng, có một cái bàn trà thấp; trên mặt bàn đặt một lọ hoa.</desc>
