<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Cái bàn có cốc, túi và chậu cây</title>
<desc>Một cái bàn gỗ ở giữa hình. Trên mặt bàn, bên trái, có một cái cốc màu xanh. Dưới bàn, giữa hai chân bàn, có một cái túi màu cam. Bên phải cái bàn, đứng riêng trên sàn, có một chậu cây xanh. Trong hình không có người.</desc>
