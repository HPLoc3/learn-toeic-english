<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Con đường có hai xe hơi và một xe đạp dựa tường</title>
<desc>Một con phố không có người. Ở phía trước, hai chiếc xe hơi, một màu hồng và một màu xanh dương, đỗ nối đuôi nhau dọc theo mép đường, cùng quay đầu sang phải. Ở phía sau, trên vỉa hè, một chiếc xe đạp đang dựa vào một bức tường gạch ở bên phải, bánh trước chạm vào tường. Bên trái vỉa hè có một cái cây.</desc>
