<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Bếp có chồng đĩa trên bàn và ba lọ trên kệ</title>
<desc>Một căn bếp không có người. Trên mặt bàn bếp bằng gỗ, bên trái, có một chồng ba cái đĩa xếp lên nhau. Phía trên bàn bếp, trên tường, có một cái kệ gỗ; trên kệ có ba cái lọ nhiều màu đứng thành một hàng.</desc>
