<rect x="0" y="0" width="800" height="400" fill="#ece8ff"/>
<rect x="0" y="400" width="800" height="200" fill="#c8ecc0"/>
<g stroke="#1b1740" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 400H800" fill="none"/>
