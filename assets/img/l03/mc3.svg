<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Công viên có ghế dài dưới cây, thùng rác và cột đèn</title>
<desc>Một góc công viên không có người. Một cái ghế dài bằng gỗ đặt dưới tán một cái cây lớn. Bên phải ghế dài, đứng trên cỏ, có một cái thùng rác màu xanh. Xa hơn về bên phải thùng rác là một cột đèn đường.</desc>
