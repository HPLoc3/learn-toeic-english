<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
<title>Phòng kho có kệ, thùng, thang và xe đẩy</title>
<desc>Một phòng kho không có người. Ở giữa là một cái kệ sắt ba tầng. Ở tầng trên cùng, ba cái thùng giấy được xếp chồng lên nhau: hai cái ở dưới, một cái nằm lên trên. Trên sàn, phía trước kệ, có hai cái thùng đặt cạnh nhau. Bên trái kệ có một chiếc xe đẩy trống. Bên phải kệ, một cái thang dựa vào cạnh kệ.</desc>
